<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Explore! Nursery 1 Science</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d6f4cf;--card:#fff;--ink:#12361f;--sun:#ffd23f;--leaf:#2e9e4f;--coral:#ff6b6b;--sky:#2f8fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10301d;--card:#1d4a2e;--ink:#fff7e0}}
:root[data-theme="dark"]{--bg:#10301d;--card:#1d4a2e;--ink:#fff7e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;font-weight:600;text-align:center;touch-action:manipulation;user-select:none}
#app{max-width:720px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:5px solid var(--sky);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stars{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font-size:1.6rem}
.stars span{filter:grayscale(1);opacity:.35;transition:.3s}
.stars span.on{filter:none;opacity:1;transform:scale(1.2)}
.round{width:60px;height:60px;border-radius:50%;background:var(--sun);font-size:1.8rem;box-shadow:0 5px 0 #c99a00;color:#12361f}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a00}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.prompt{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;line-height:1.15}
.play{display:flex;gap:16px;justify-content:center;align-items:center;min-height:130px}
.pic{font-size:clamp(5.5rem,30vw,9rem);background:var(--bg);border-radius:34px;padding:8px 24px;line-height:1.1;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.pic:active{transform:scale(1.08)}
.pic small{display:block;font-size:1.6rem;font-weight:800}
.big-emoji{font-size:clamp(5rem,26vw,8rem);line-height:1}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.opt{width:clamp(95px,28vw,135px);height:clamp(105px,31vw,150px);border-radius:30px;font-size:3.6rem;background:var(--card);box-shadow:0 7px 0 rgba(0,0,0,.25);line-height:1.1;padding:6px}
.opt small{display:block;font-size:1.25rem;font-weight:800}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.big{font-size:1.9rem;font-weight:800;padding:16px 40px;border-radius:40px;background:var(--leaf);color:#fff;box-shadow:0 7px 0 #1c6e34}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #1c6e34}
.mascot{font-size:7rem;line-height:1}
.msg{min-height:2.4rem;font-size:1.7rem;font-weight:800;color:var(--leaf)}
.msg.bad{color:var(--coral)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hop{animation:hop .6s}
@keyframes hop{40%{transform:translateY(-24px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var A=[['Cow','🐄','moo'],['Dog','🐶','woof woof'],['Cat','🐱','meow'],['Sheep','🐑','baa'],['Frog','🐸','ribbit'],['Duck','🦆','quack quack'],['Horse','🐴','neigh'],['Pig','🐷','oink oink']];
var S=[['see','Eyes','👀','🌈'],['hear','Ears','👂','🎵'],['smell','Nose','👃','🌸'],['taste','Tongue','👅','🍓'],['touch','Hands','✋','🧸']];
var GOOD=['Great job!','Well done!','Super!','You are a scientist!','Wonderful!','Hooray!','Fantastic!'];
var app=document.getElementById('app'),sound=true,rounds=[],idx=0,score=0,cur=null,ac=null;

function say(t){try{if(!sound||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.78;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}
function tone(seq){try{if(!sound)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();seq.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.26)})}catch(e){}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return a.sort(function(){return Math.random()-.5})}
function three(arr,ans){var s=[ans];while(s.length<3){var x=pick(arr);if(s.indexOf(x)<0)s.push(x)}return shuffle(s)}
function toggle(){sound=!sound;document.getElementById('snd').textContent=sound?'🔊':'🔇';if(!sound&&window.speechSynthesis)speechSynthesis.cancel()}

function home(){
  app.innerHTML='<div class="top"><span></span><button class="round" id="snd" aria-label="Sound on or off">'+(sound?'🔊':'🔇')+'</button></div>'+
  '<div class="card"><div class="mascot">🦋</div><div class="prompt">Hello! Let’s explore animals and our body!</div></div>'+
  '<div><button class="big" id="go">▶ Start</button></div>';
  document.getElementById('snd').onclick=toggle;
  document.getElementById('go').onclick=function(){
    var an=shuffle(A.slice()),se=shuffle(S.slice()),t=['meet','who','sense','meet','who','sense','who','sense'],ai=0,si=0;
    rounds=t.map(function(k){return k==='sense'?{t:k,d:se[si++%se.length]}:{t:k,d:an[ai++%an.length]}});idx=0;score=0;next();
  };
}
function bar(){
  var s='';for(var i=0;i<rounds.length;i++)s+='<span class="'+(i<score?'on':'')+'">⭐</span>';
  return '<div class="top"><div class="stars">'+s+'</div><button class="round" id="rep" aria-label="Hear again">🔊</button></div>';
}
function shell(prompt,mid,low){
  app.innerHTML=bar()+'<div class="card"><div class="prompt">'+prompt+'</div></div><div class="card play" id="play">'+mid+'</div><div class="msg" id="msg"></div><div class="choices" id="ch">'+(low||'')+'</div>';
  document.getElementById('rep').onclick=function(){say(cur.say)};
}
function setMsg(t,bad){var m=document.getElementById('msg');m.textContent=t;m.className='msg'+(bad?' bad':'')}
function correct(el){
  var c=pick(GOOD);score++;tone([523,659,784,1047]);setMsg(c+' ⭐');
  if(el)el.classList.add('hop');
  setTimeout(function(){say(c)},350);
  app.querySelectorAll('button.opt').forEach(function(b){b.disabled=true});
  setTimeout(function(){idx++;next()},2200);
}
function wrong(el){
  tone([220,180]);setMsg('Oops! Try again, you can do it!',true);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');say('Oops! Try again. You can do it!');
}
function next(){
  if(idx>=rounds.length)return finish();
  var r=rounds[idx];
  if(r.t==='meet')meet(r.d);else if(r.t==='who')who(r.d);else sense(r.d);
}
function meet(a){
  cur={say:'The '+a[0]+' says '+a[2]+'! Touch the picture to hear it again.'};
  shell('Meet the '+a[0]+'!','<button class="pic" id="pc" aria-label="'+a[0]+'">'+a[1]+'<small>'+a[0]+' says “'+a[2]+'”</small></button>','<button class="big" id="nx">Next ➜</button>');
  say(cur.say);
  document.getElementById('pc').onclick=function(){tone([660]);say('The '+a[0]+' says '+a[2]+'!')};
  document.getElementById('nx').onclick=function(){correct(this)};
}
function who(a){
  cur={say:'Who says '+a[2]+'?'};
  shell('Who says “'+a[2]+'”?','<div class="big-emoji">🔊❓</div>','');
  say(cur.say);
  var ch=document.getElementById('ch');
  ch.innerHTML=three(A,a).map(function(o){return '<button class="opt" data-k="'+o[0]+'" aria-label="'+o[0]+'">'+o[1]+'<small>'+o[0]+'</small></button>'}).join('');
  Array.prototype.forEach.call(ch.children,function(b){b.onclick=function(){
    if(b.dataset.k===a[0]){say('The '+a[0]+' says '+a[2]+'!');setTimeout(function(){correct(b)},1400)}else wrong(b);
  }});
}
function sense(s){
  cur={say:'Which part of our body helps us '+s[0]+'?'};
  shell('Which body part helps us <span style="color:var(--coral)">'+s[0]+'</span>?','<div class="big-emoji">'+s[3]+'</div>','');
  say(cur.say);
  var ch=document.getElementById('ch');
  ch.innerHTML=three(S,s).map(function(o){return '<button class="opt" data-k="'+o[0]+'" aria-label="'+o[1]+'">'+o[2]+'<small>'+o[1]+'</small></button>'}).join('');
  Array.prototype.forEach.call(ch.children,function(b){b.onclick=function(){
    if(b.dataset.k===s[0]){say('Yes! We '+s[0]+' with our '+s[1].toLowerCase()+'!');setTimeout(function(){correct(b)},1800)}else wrong(b);
  }});
}
function finish(){
  tone([523,659,784,1047,784,1047,1319]);
  var s='';for(var i=0;i<score;i++)s+='⭐';
  app.innerHTML='<div class="top"><span></span><button class="round" id="snd">'+(sound?'🔊':'🔇')+'</button></div><div class="card"><div class="mascot hop">🦋🎉</div><div class="prompt">You did it! You are a little scientist!</div><div class="stars" style="margin-top:10px">'+s+'</div></div><div><button class="big" id="again">↻ Play again</button></div>';
  document.getElementById('snd').onclick=toggle;
  document.getElementById('again').onclick=home;
  setTimeout(function(){say('You did it! You are a little scientist!')},400);
}
home();
</script>
</body>
</html>
