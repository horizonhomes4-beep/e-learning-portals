<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let’s Count! Nursery 1 Maths</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cdebff;--card:#fff;--ink:#1f2a44;--sun:#ffd23f;--grass:#2fb463;--coral:#ff6b6b;--sky:#2f8fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213d;--card:#22325a;--ink:#fff7e0}}
:root[data-theme="dark"]{--bg:#14213d;--card:#22325a;--ink:#fff7e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;font-weight:600;text-align:center;touch-action:manipulation;user-select:none}
#app{max-width:720px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:5px solid var(--sky);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stars{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;font-size:1.6rem}
.stars span{filter:grayscale(1);opacity:.35;transition:.3s}
.stars span.on{filter:none;opacity:1;transform:scale(1.2)}
.round{width:60px;height:60px;border-radius:50%;background:var(--sun);font-size:1.8rem;box-shadow:0 5px 0 #c99a00;color:#1f2a44}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a00}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.prompt{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;line-height:1.15}
.play{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:130px}
.item{font-size:clamp(3rem,16vw,5rem);background:none;padding:4px;border-radius:20px;transition:transform .2s}
.item:active{transform:scale(1.2)}
.item.done{background:var(--sun);transform:scale(.9)}
.item .n{display:block;font-size:1.4rem;font-weight:800}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.num{width:clamp(90px,26vw,130px);height:clamp(90px,26vw,130px);border-radius:30px;font-size:4rem;font-weight:800;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.num:nth-child(1){background:var(--coral)}.num:nth-child(2){background:var(--sky)}.num:nth-child(3){background:var(--grass)}
.num:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.groups{display:flex;gap:14px;width:100%}
.group{flex:1;background:var(--bg);border-radius:24px;padding:10px;font-size:clamp(1.8rem,9vw,3rem);line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.big{font-size:1.9rem;font-weight:800;padding:16px 40px;border-radius:40px;background:var(--grass);color:#fff;box-shadow:0 7px 0 #1b7f43}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #1b7f43}
.mascot{font-size:7rem;line-height:1}
.msg{min-height:2.4rem;font-size:1.7rem;font-weight:800;color:var(--grass)}
.msg.bad{color:var(--coral)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.hop{animation:hop .6s}
@keyframes hop{40%{transform:translateY(-24px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var W=['zero','one','two','three','four','five'];
var EM=['🍎','🐟','⭐','🐥','🎈','🚗','🌸','🐞'];
var GOOD=['Great job!','Well done!','Super!','You are a star!','Wonderful!','Hooray!','Fantastic!'];
var app=document.getElementById('app'),sound=true,rounds=[],idx=0,score=0,cur=null,ac=null;

function say(t){try{if(!sound||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.3;speechSynthesis.speak(u)}catch(e){}}
function tone(seq){try{if(!sound)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();seq.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.13;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.26)})}catch(e){}}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[rnd(0,a.length-1)]}
function shuffle(a){return a.sort(function(){return Math.random()-.5})}
function mk(n,e){return new Array(n+1).join(e)}

function home(){
  app.innerHTML='<div class="top"><span></span><button class="round" id="snd" aria-label="Sound on or off">🔊</button></div>'+
  '<div class="card"><div class="mascot">🐻</div><div class="prompt">Hello! Let’s count together!</div></div>'+
  '<div><button class="big" id="go">▶ Start</button></div>';
  document.getElementById('snd').onclick=toggle;
  document.getElementById('go').onclick=function(){
    var types=['count','find','more','count','find','more','count','find'];
    rounds=types.map(function(t){return t});idx=0;score=0;next();
  };
}
function toggle(){sound=!sound;document.getElementById('snd').textContent=sound?'🔊':'🔇';if(!sound&&window.speechSynthesis)speechSynthesis.cancel()}
function bar(){
  var s='';for(var i=0;i<rounds.length;i++)s+='<span class="'+(i<score?'on':'')+'">⭐</span>';
  return '<div class="top"><div class="stars">'+s+'</div><button class="round" id="rep" aria-label="Hear again">🔊</button></div>';
}
function setMsg(t,bad){var m=document.getElementById('msg');m.textContent=t;m.className='msg'+(bad?' bad':'')}
function choicesFor(ans){var s=[ans];while(s.length<3){var x=rnd(1,5);if(s.indexOf(x)<0)s.push(x)}return shuffle(s)}
function showChoices(box,ans,onDone){
  box.innerHTML=choicesFor(ans).map(function(n){return '<button class="num" data-n="'+n+'" aria-label="'+W[n]+'">'+n+'</button>'}).join('');
  Array.prototype.forEach.call(box.children,function(b){b.onclick=function(){
    if(+b.dataset.n===ans){correct(b)}else{wrong(b)}
  }});
}
function correct(el){
  var c=pick(GOOD);score++;tone([523,659,784,1047]);setMsg(c+' ⭐');
  if(el)el.classList.add('hop');
  setTimeout(function(){say(c)},350);
  document.getElementById('app').querySelectorAll('button.num,button.group').forEach(function(b){b.disabled=true});
  setTimeout(function(){idx++;next()},2200);
}
function wrong(el){
  tone([220,180]);setMsg('Oops! Try again, you can do it!',true);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');say('Oops! Try again. You can do it!');
}

function next(){
  if(idx>=rounds.length)return finish();
  var t=rounds[idx];
  if(t==='count')countRound();else if(t==='find')findRound();else moreRound();
}
function shell(prompt,mid,low){
  app.innerHTML=bar()+'<div class="card"><div class="prompt" id="p">'+prompt+'</div></div><div class="card play" id="play">'+mid+'</div><div class="msg" id="msg"></div><div class="choices" id="ch">'+(low||'')+'</div>';
  document.getElementById('rep').onclick=function(){say(cur.say)};
}
function countRound(){
  var n=rnd(1,5),e=pick(EM),tapped=0,html='';
  for(var i=1;i<=n;i++)html+='<button class="item" data-i="'+i+'" aria-label="'+e+'">'+e+'</button>';
  cur={say:'Touch each picture to count them.'};
  shell('Touch each one to count!',html,'');
  say(cur.say);
  Array.prototype.forEach.call(document.querySelectorAll('.item'),function(b){b.onclick=function(){
    if(b.classList.contains('done'))return;
    b.classList.add('done');tapped++;b.innerHTML=e+'<span class="n">'+tapped+'</span>';tone([400+tapped*90]);say(W[tapped]);
    if(tapped===n){
      setTimeout(function(){
        document.getElementById('p').textContent='How many are there?';cur.say='How many are there?';say(cur.say);
        showChoices(document.getElementById('ch'),n);
      },1100);
    }
  }});
}
function findRound(){
  var n=rnd(1,5);cur={say:'Touch the number '+W[n]+'.'};
  shell('Touch the number '+n+'<br><small>('+W[n]+')</small>','<div class="mascot" style="font-size:4.5rem">'+mk(n,'🍎')+'</div>','');
  say(cur.say);showChoices(document.getElementById('ch'),n);
}
function moreRound(){
  var a=rnd(1,5),b;do{b=rnd(1,5)}while(b===a);
  var e1=pick(EM),e2;do{e2=pick(EM)}while(e2===e1);
  var win=a>b?0:1;cur={say:'Which group has more? Touch it.'};
  shell('Which group has more?','<div class="groups"><button class="group" data-g="0" aria-label="group one">'+mk(a,e1)+'</button><button class="group" data-g="1" aria-label="group two">'+mk(b,e2)+'</button></div>','');
  say(cur.say);
  Array.prototype.forEach.call(document.querySelectorAll('.group'),function(g){g.onclick=function(){+g.dataset.g===win?correct(g):wrong(g)}});
}
function finish(){
  tone([523,659,784,1047,784,1047,1319]);
  var s='';for(var i=0;i<score;i++)s+='⭐';
  app.innerHTML='<div class="top"><span></span><button class="round" id="snd">'+(sound?'🔊':'🔇')+'</button></div><div class="card"><div class="mascot hop">🐻🎉</div><div class="prompt">You did it! You are a counting star!</div><div class="stars" style="margin-top:10px">'+s+'</div></div><div><button class="big" id="again">↻ Play again</button></div>';
  document.getElementById('snd').onclick=toggle;
  document.getElementById('again').onclick=home;
  setTimeout(function(){say('You did it! You are a counting star!')},400);
}
home();
</script>
</body>
</html>
